<title id="t">Knowly: a personal map of everything I want to learn</title>
<desc id="d">Knowly: a personal map of everything I want to learn. A dark tree of knowledge: a node lights up when you actually do something with it. Local-first: your data stays on your own machine. Status: in development · not public yet.</desc>
