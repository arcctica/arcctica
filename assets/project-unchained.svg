<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 272" width="900" height="272" role="img" aria-labelledby="t d">
<title id="t">Unchained: OSINT &amp; attack-surface reconnaissance</title>
<desc id="d">Unchained: OSINT &amp; attack-surface reconnaissance. Enter a domain or a Discord ID: it detects the type and queries every matching source in parallel. Every source is a plugin in its own process, with a timeout and an output limit. Live: WHOIS/DNS, crt.sh, Discord. Hand-written graph layout; scrypt, TOTP 2FA, CSRF protection. Status: early prototype · ~25k lines · not public yet.</desc>
<rect x="0.5" y="0.5" width="899" height="271" rx="10" fill="#0d0d0d" stroke="#30363d"/>
